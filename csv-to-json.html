    // 去掉 BOM 字符，按行拆分，过滤空行
    const lines = csv.replace(/^\uFEFF/, "").trim().split("\n").filter(l => l.trim() !== "");

    // 第一行是表头，提取年份
    const headers = lines[0].split(",").map(s => s.trim());
    const years = headers.slice(1); // 去掉“地区”那列

    const result = [];

    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(",").map(s => s.trim());
      const province = cols[0];

      for (let j = 0; j < years.length; j++) {
        const value = Number(cols[j + 1]);
        if (!isNaN(value)) {
          result.push({
            province: province,
            year: years[j],
            value: value
          });
        }
      }
    }

    console.log(JSON.stringify(result, null, 2));
  </script>
