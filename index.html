<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>中国各省人均消费支出分析</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: "PingFang SC", sans-serif; background: linear-gradient(135deg, #E6EAE9 0%, #D4DFE2 100%); color: #4A4A4A; width: 100vw; height: 100vh; overflow: hidden; box-sizing: border-box; }
    .container { display: flex; padding: 15px; gap: 15px; width: 100vw; height: 100vh; box-sizing: border-box; overflow: hidden; }
    .left { flex: 0 0 calc(55% - 7.5px); display: flex; flex-direction: column; min-width: 0; height: 100%; }
    .right { flex: 0 0 calc(45% - 7.5px); display: flex; flex-direction: column; gap: 15px; min-width: 0; height: 100%; }
    
    .panel { background: linear-gradient(180deg, #FDFDFC 0%, #F2F4F5 100%); border-radius: 12px; box-shadow: 0 6px 16px rgba(0,0,0,0.06); display: flex; flex-direction: column; border: 1px solid #E0DDD5; overflow: hidden; position: relative; flex: 1; transition: background 0.5s ease; }
    .panel.map-zoomed { background: linear-gradient(180deg, #E5E8E8 0%, #CDD5D5 100%); }

    .scroll-wrapper { width: 100%; height: 100%; position: relative; }
    .wide-mode { overflow-x: auto; overflow-y: hidden; }
    .wide-mode::-webkit-scrollbar { height: 10px; }
    .wide-mode::-webkit-scrollbar-track { background: #E0DDD5; border-radius: 5px; }
    .wide-mode::-webkit-scrollbar-thumb { background: #7B9EA8; border-radius: 5px; }
    .narrow-mode { overflow-y: auto; overflow-x: hidden; }
    .narrow-mode::-webkit-scrollbar { width: 10px; }
    .narrow-mode::-webkit-scrollbar-track { background: #E0DDD5; border-radius: 5px; }
    .narrow-mode::-webkit-scrollbar-thumb { background: #7B9EA8; border-radius: 5px; }
    
    svg { display: block; }
    .bar { cursor: pointer; transition: fill 0.2s; }
    .province-path { stroke: #fff; stroke-width: 0.5; cursor: pointer; transition: fill 0.4s, stroke 0.4s; }
    .province-path.zoomed { stroke: #88999A; stroke-width: 1; }
    
    #map { cursor: grab; }
    #map:active { cursor: grabbing; }
  </style>
</head>
<body>
  <div class="container">
    <div class="left">
      <div class="panel" id="map-panel">
        <div id="map-wrapper" style="flex: 1; width: 100%; position: relative;">
          <svg id="map" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%;"></svg>
        </div>
        <div style="height: 80px; width: 100%; flex-shrink: 0; position: relative;">
          <div id="timeline-container" style="height: 60px; width: 100%;"></div>
          <div style="position: absolute; bottom: 5px; left: 15px; font-size: 11px; color: #888;">注：仅展示已获取的 31 个省级行政区数据。* 地图区域可用滚轮缩放 *</div>
        </div>
      </div>
    </div>
    <div class="right">
      <div class="panel"><div class="scroll-wrapper wide-mode" id="bar-scroll"><svg id="bar" style="position: absolute; left: 0; top: 0;"></svg></div></div>
      <div class="panel"><div class="scroll-wrapper wide-mode" id="line-scroll"><svg id="line" style="position: absolute; left: 0; top: 0;"></svg></div></div>
    </div>
  </div>
  
  <script>
    let allData = [], currentYear = "2025", currentProvince = "北京市", isNarrowMode = false;
    
const morandiColors = { mapLow: "#DCE4E6", mapHigh: "#6A8E96", bar: "#7B9EA8", barHover: "#C28E79", line: "#A8B9C0" };     const zoomedColors = { mapLow: "#B5C2C4", mapHigh: "#4E6A72" }; 

    let mapWidth, mapHeight, baseBarWidth, baseLineWidth;
    const mapSvg = d3.select("#map"), mapGroup = mapSvg.append("g"); 
    let currentZoomK = 1;
    let isMapZoomed = false;

    const shortNames = { "北京市": "京", "天津市": "津", "河北省": "冀", "山西省": "晋", "内蒙古自治区": "蒙", "辽宁省": "辽", "吉林省": "吉", "黑龙江省": "黑", "上海市": "沪", "江苏省": "苏", "浙江省": "浙", "安徽省": "皖", "福建省": "闽", "江西省": "赣", "山东省": "鲁", "河南省": "豫", "湖北省": "鄂", "湖南省": "湘", "广东省": "粤", "广西壮族自治区": "桂", "海南省": "琼", "重庆市": "渝", "四川省": "川", "贵州省": "贵", "云南省": "云", "西藏自治区": "藏", "陕西省": "陕", "甘肃省": "甘", "青海省": "青", "宁夏回族自治区": "宁", "新疆维吾尔自治区": "新", "香港特别行政区": "港", "澳门特别行政区": "澳", "台湾省": "台" };

    const labelAdjustments = {
      "上海市": [0.65, 35, 0], "江苏省": [0.75, 15, -5], "浙江省": [0.75, 35, 5],
      "广东省": [0.9, 0, 25], "香港特别行政区": [0.55, 40, 45], "澳门特别行政区": [0.55, 15, 50], "台湾省": [0.7, 25, 0],
      "北京市": [0.65, -20, -15], "天津市": [0.65, 25, 0],
      "新疆维吾尔自治区": [1.0, 0, 0], "西藏自治区": [1.0, 0, 0], "内蒙古自治区": [1.0, 0, 0], "青海省": [1.0, 0, 0], "四川省": [1.0, 0, 0], "黑龙江省": [1.0, 0, 0], "云南省": [0.95, 0, 0], "甘肃省": [0.95, 0, 0], "广西壮族自治区": [0.9, 0, 0],
      "湖南省": [0.9, 0, 0], "湖北省": [0.9, 0, 0], "河南省": [0.9, 0, 0], "山东省": [0.9, 0, 0], "辽宁省": [0.9, 0, 0], "江西省": [0.85, 0, 0], "陕西省": [0.85, 0, 0], "山西省": [0.85, 0, 0], "河北省": [0.85, 0, 0], "吉林省": [0.85, 0, 0], "安徽省": [0.85, 0, 0], "贵州省": [0.85, 0, 0], "福建省": [0.8, 0, 0], "重庆市": [0.8, 0, 0],
      "海南省": [0.75, 0, 15], "宁夏回族自治区": [0.8, -10, 0]
    };

    function shortenProvName(name) { return name ? name.replace(/(省|市|回族自治区|维吾尔自治区|壮族自治区|自治区)/g, '') : ""; }

    Promise.all([d3.json("china-provinces.json"), d3.json("data.json")]).then(([geoData, data]) => {
      allData = data;
      function updateDimensions() {
        const rightPanel = document.querySelector(".right");
        isNarrowMode = rightPanel.clientWidth < 500;
        document.getElementById("bar-scroll").className = "scroll-wrapper " + (isNarrowMode ? "narrow-mode" : "wide-mode");
        document.getElementById("line-scroll").className = "scroll-wrapper " + (isNarrowMode ? "narrow-mode" : "wide-mode");
        baseBarWidth = document.getElementById("bar-scroll").clientWidth - (isNarrowMode ? 20 : 10); 
        baseLineWidth = document.getElementById("line-scroll").clientWidth - (isNarrowMode ? 20 : 10);
        mapWidth = document.getElementById("map-wrapper").clientWidth || 700;
        mapHeight = document.getElementById("map-wrapper").clientHeight || 600; 
      }
      updateDimensions();

      function drawMap() {
        mapGroup.selectAll("*").remove(); mapSvg.selectAll("text").remove(); 
        const projection = d3.geoMercator().center([104, 37.5]).scale(mapWidth * 0.84).translate([mapWidth / 2, mapHeight / 2 + 10]);
        const pathGenerator = d3.geoPath().projection(projection);
        
        mapSvg.append("text").attr("x", 20).attr("y", 35).style("font-size", "18px").style("font-weight", "bold").style("fill", "#555").text("中国各省人均消费支出分布图");

        const baseFontSize = 12; 

        mapGroup.selectAll(".province-path").data(geoData.features).join("path").attr("class", "province-path").attr("d", pathGenerator).attr("fill", d => getMapColor(matchProvName(d.properties.name)))
          .on("mouseover", function(event, d) {
            const provName = matchProvName(d.properties.name);
            d3.select(this).attr("fill", morandiColors.barHover);
            mapGroup.selectAll(".map-text-group").filter(v => v.properties.name === d.properties.name).style("opacity", 0);

            const center = pathGenerator.centroid(d);
            const val = getDataForProvince(provName);
            
            let offsetY = -40;
            if (center[1] < 60) offsetY = 45; 

            const hoverGroup = mapGroup.append("g").attr("class", "hover-display").attr("transform", `translate(${center[0]}, ${center[1] + offsetY})`).style("pointer-events", "none");

            hoverGroup.append("text").attr("text-anchor", "middle").attr("dy", "0em")
              .style("font-size", (16 / currentZoomK) + "px").style("font-weight", "bold").style("fill", "#333")
              .style("paint-order", "stroke").style("stroke", "rgba(255, 255, 255, 0.9)").style("stroke-width", "4px").style("stroke-linejoin", "round").text(provName);

            hoverGroup.append("text").attr("text-anchor", "middle").attr("dy", "1.4em")
              .style("font-size", (22 / currentZoomK) + "px").style("font-weight", "900").style("fill", morandiColors.barHover)
              .style("paint-order", "stroke").style("stroke", "rgba(255, 255, 255, 0.9)").style("stroke-width", "4px").style("stroke-linejoin", "round").text(val ? val.toLocaleString() : "");

            updateLineChart(provName);
          }).on("mouseout", function(event, d) {
            d3.select(this).attr("fill", getMapColor(matchProvName(d.properties.name)));
            mapGroup.selectAll(".hover-display").remove();
            mapGroup.selectAll(".map-text-group").filter(v => v.properties.name === d.properties.name).style("opacity", 1);
          });

        const textGroups = mapGroup.selectAll(".map-text-group").data(geoData.features).join("g").attr("class", "map-text-group").style("pointer-events", "none").style("transition", "opacity 0.2s");

        textGroups.each(function(d) {
          const provName = matchProvName(d.properties.name);
          const adjust = labelAdjustments[provName] || [1.0, 0, 0];
          const center = pathGenerator.centroid(d);
          
          if (adjust[1] !== 0 || adjust[2] !== 0) {
            d3.select(this).append("line")
              .attr("x1", center[0]).attr("y1", center[1])
              .attr("x2", center[0] + adjust[1]).attr("y2", center[1] + adjust[2])
              .style("stroke", "#666").style("stroke-width", 1).style("stroke-dasharray", "3,3").attr("class", "guide-line");
            
            d3.select(this).append("circle")
              .attr("cx", center[0] + adjust[1]).attr("cy", center[1] + adjust[2])
              .attr("r", 2).style("fill", "#666").attr("class", "guide-dot");
          }

          d3.select(this).append("text")
            .attr("class", "prov-full")
            .attr("transform", `translate(${center[0] + adjust[1]}, ${center[1] + adjust[2]})`)
            .attr("text-anchor", "middle")
            .attr("dy", "0.35em")
            .style("font-size", (baseFontSize * adjust[0]) + "px")
            .style("font-weight", "bold")
            .style("fill", "#333")
            .style("text-shadow", "0 1px 4px rgba(255,255,255,0.9), 0 0 2px rgba(255,255,255,0.9)")
            .text(provName);
            
          d3.select(this).append("text")
            .attr("class", "prov-zoom")
            .attr("transform", `translate(${center[0] + adjust[1]}, ${center[1] + adjust[2]})`)
            .attr("text-anchor", "middle")
            .attr("dy", "0.35em")
            .style("font-size", (baseFontSize * adjust[0]) + "px")
            .style("font-weight", "900")
            .style("fill", "#fff") 
            .style("text-shadow", "0 1px 3px rgba(0,0,0,0.6)")
            .style("opacity", 0)
            .style("display", "none")
            .text(() => {
               const v = getDataForProvince(provName);
               return v ? `${shortNames[provName] || ""} ${v.toLocaleString()}` : "";
            });
        });

        mapSvg.call(d3.zoom().scaleExtent([1, 8]).on("zoom", (event) => {
          currentZoomK = event.transform.k;
          mapGroup.attr("transform", event.transform);
          
          const shouldZoom = currentZoomK > 1.2;
          
          if (shouldZoom !== isMapZoomed) {
             isMapZoomed = shouldZoom;
             d3.select("#map-panel").classed("map-zoomed", isMapZoomed);
             mapGroup.selectAll(".province-path").classed("zoomed", isMapZoomed).attr("fill", d => getMapColor(matchProvName(d.properties.name)));
          }

          textGroups.each(function(d) {
            const adjust = labelAdjustments[matchProvName(d.properties.name)] || [1.0, 0, 0];
            d3.select(this).select(".prov-full").style("font-size", ((baseFontSize * adjust[0]) / currentZoomK) + "px");
            d3.select(this).select(".prov-zoom").style("font-size", ((baseFontSize * adjust[0]) / currentZoomK) + "px");
          });
          textGroups.selectAll(".guide-line").style("stroke", isMapZoomed ? "#ccc" : "#666").style("stroke-width", (1 / currentZoomK));
          textGroups.selectAll(".guide-dot").style("fill", isMapZoomed ? "#ccc" : "#666").attr("r", (2 / currentZoomK));

          if (currentZoomK > 1.2) {
            textGroups.selectAll(".prov-full").style("display", "none").style("opacity", 0);
            textGroups.selectAll(".prov-zoom").style("display", "block").style("opacity", 1);
          } else {
            textGroups.selectAll(".prov-full").style("display", "block").style("opacity", 1);
            textGroups.selectAll(".prov-zoom").style("display", "none").style("opacity", 0);
          }
        }));
      }

      function matchProvName(geoName) { let found = allData.find(d => d.province === geoName); return found ? geoName : (allData.find(d => d.province === geoName + "市") ? geoName + "市" : (allData.find(d => d.province === geoName + "省") ? geoName + "省" : (allData.find(d => d.province === geoName + "自治区") ? geoName + "自治区" : (allData.find(d => d.province === geoName + "壮族自治区") ? geoName + "壮族自治区" : (allData.find(d => d.province === geoName + "回族自治区") ? geoName + "回族自治区" : (allData.find(d => d.province === geoName + "维吾尔自治区") ? geoName + "维吾尔自治区" : geoName)))))); }
      function getDataForProvince(provName) { const record = allData.find(d => d.province === provName && d.year === currentYear); return record ? record.value : null; }
      
      function getMapColor(provName) { 
        const val = getDataForProvince(provName); 
        if (!val) return isMapZoomed ? "#888" : "#EEEEEE"; 
        const extent = d3.extent(allData.filter(d => d.year === currentYear), d => d.value); 
        const colors = isMapZoomed ? zoomedColors : morandiColors;
        return d3.scaleLinear().domain(extent).range([colors.mapLow, colors.mapHigh])(val); 
      }
      
      function updateMapColors() { mapGroup.selectAll(".province-path").transition().duration(300).attr("fill", d => getMapColor(matchProvName(d.properties.name))); }

      function renderTimeline() {
        d3.select("#timeline-container").selectAll("*").remove();
        const years = [...new Set(allData.map(d => d.year))].sort();
        const timeSvg = d3.select("#timeline-container").append("svg").attr("width", "100%").attr("height", 60);
        const xScale = d3.scalePoint().domain(years).range([30, mapWidth - 30]);
        timeSvg.append("line").attr("x1", 30).attr("y1", 30).attr("x2", mapWidth - 30).attr("y2", 30).attr("stroke", "#ccc").attr("stroke-width", 2);
        timeSvg.selectAll(".time-hitbox").data(years).join("circle").attr("cx", d => xScale(d)).attr("cy", 30).attr("r", 20).attr("fill", "transparent").style("cursor", "pointer")
          .on("mouseover", function(event, d) {
            currentYear = d; timeSvg.selectAll(".time-dot").attr("fill", y => y === currentYear ? morandiColors.barHover : "#B0BEC5");
            timeSvg.selectAll(".time-label").style("fill", y => y === currentYear ? "#C28E79" : "#666").style("font-weight", y => y === currentYear ? "bold" : "normal");
            updateMapColors(); updateBarChart();
          });
        timeSvg.selectAll(".time-dot").data(years).join("circle").attr("class", "time-dot").attr("cx", d => xScale(d)).attr("cy", 30).attr("r", 6).attr("fill", d => d === currentYear ? morandiColors.barHover : "#B0B5C5").style("pointer-events", "none");
        timeSvg.selectAll(".time-label").data(years).join("text").attr("class", "time-label").attr("x", d => xScale(d)).attr("y", 15).attr("text-anchor", "middle").style("font-size", "12px").style("fill", d => d === currentYear ? "#C28E79" : "#666").style("font-weight", d => d === currentYear ? "bold" : "normal").style("pointer-events", "none").text(d => d);
      }

      function updateBarChart() {
        const barSvg = d3.select("#bar"); barSvg.selectAll("*").remove(); 
        const dataCurrent = allData.filter(d => d.year === currentYear).sort((a, b) => b.value - a.value);
        
        if (isNarrowMode) {
          const rowHeight = 28; 
          const margin = { top: 60, right: 40, bottom: 40, left: 140 }; 
          const totalHeight = margin.top + (dataCurrent.length * rowHeight) + margin.bottom;
          
          barSvg.attr("width", baseBarWidth).attr("height", totalHeight).style("position", "relative");
          const chartGroup = barSvg.append("g");
          
          const yScale = d3.scaleBand().domain(dataCurrent.map(d => d.province)).range([margin.top, totalHeight - margin.bottom]).padding(0.3);
          const xScale = d3.scaleLinear().domain([0, d3.max(dataCurrent, d => d.value) * 1.05]).range([margin.left, baseBarWidth - margin.right]);
          
          barSvg.append("text").attr("x", 20).attr("y", 30).style("font-size", "16px").style("font-weight", "bold").style("fill", "#555").text(`${currentYear}年消费支出排名（元）`);
          barSvg.append("text").attr("x", 20).attr("y", 50).style("font-size", "12px").style("fill", "#888").text("* 鼠标滚轮可放大图表 *");
          
          chartGroup.selectAll(".bar").data(dataCurrent).join("rect").attr("class", "bar").attr("x", margin.left).attr("y", d => yScale(d.province)).attr("width", d => xScale(d.value) - margin.left).attr("height", yScale.bandwidth()).attr("fill", morandiColors.bar)
            .on("mouseover", function(event, d) { d3.select(this).attr("fill", morandiColors.barHover); chartGroup.selectAll(".bar-label").filter(l => l.province === d.province).style("fill", morandiColors.barHover).style("font-weight", "bold"); updateLineChart(d.province); })
            .on("mouseout", function(event, d) { d3.select(this).attr("fill", morandiColors.bar); chartGroup.selectAll(".bar-label").style("fill", "#444").style("font-weight", "bold"); });
          
          chartGroup.append("g").attr("transform", `translate(0, ${totalHeight - margin.bottom})`).call(d3.axisBottom(xScale).tickValues([0, 20000, 40000]).tickFormat(d => d.toLocaleString())).style("color", "#7A7A7A");
          
          chartGroup.selectAll(".bar-label").data(dataCurrent).join("text").attr("class", "bar-label")
            .attr("x", margin.left - 15).attr("y", d => yScale(d.province) + yScale.bandwidth() / 2)
            .attr("text-anchor", "end").attr("dy", "0.35em")
            .style("font-size", "12px").style("font-weight", "bold").style("fill", "#444").style("pointer-events", "none").text(d => d.province);
            
          chartGroup.selectAll(".bar-value").data(dataCurrent).join("text").attr("class", "bar-value")
            .attr("x", d => xScale(d.value) - 8).attr("y", d => yScale(d.province) + yScale.bandwidth() / 2)
            .attr("dy", "0.35em").attr("text-anchor", "end")
            .style("font-size", "12px").style("font-weight", "bold").style("fill", "#fff")
            .style("text-shadow", "0 1px 2px rgba(0,0,0,0.3)")
            .text(d => d.value.toLocaleString());
            
        } else {
          const barHeight = document.getElementById("bar-scroll").clientHeight - 15; 
          barSvg.attr("width", baseBarWidth).attr("height", barHeight).style("position", "absolute");
          const margin = { top: 60, right: 30, bottom: 100, left: 70 };
          const chartGroup = barSvg.append("g");
          const xScale = d3.scaleBand().domain(dataCurrent.map(d => d.province)).range([margin.left, baseBarWidth - margin.right]).padding(0.25);
          const yScale = d3.scaleLinear().domain([0, d3.max(dataCurrent, d => d.value)]).range([barHeight - margin.bottom, margin.top]);
          barSvg.append("text").attr("x", 20).attr("y", 30).style("font-size", "16px").style("font-weight", "bold").style("fill", "#555").text(`${currentYear}年消费支出排名（元）`);
          barSvg.append("text").attr("x", 20).attr("y", 50).style("font-size", "12px").style("fill", "#888").text("* 鼠标滚轮可放大图表 *");
          
          const bars = chartGroup.selectAll(".bar").data(dataCurrent).join("rect").attr("class", "bar").attr("x", d => xScale(d.province)).attr("y", d => yScale(d.value)).attr("width", xScale.bandwidth()).attr("height", d => barHeight - margin.bottom - yScale(d.value)).attr("fill", morandiColors.bar)
            .on("mouseover", function(event, d) { d3.select(this).attr("fill", morandiColors.barHover); chartGroup.selectAll(".bar-label").filter(l => l.province === d.province).style("fill", morandiColors.barHover).style("font-weight", "bold"); updateLineChart(d.province); })
            .on("mouseout", function(event, d) { d3.select(this).attr("fill", morandiColors.bar); chartGroup.selectAll(".bar-label").style("fill", "#444").style("font-weight", "bold"); });
            
          chartGroup.append("g").attr("transform", `translate(${margin.left}, 0)`).call(d3.axisLeft(yScale).ticks(5).tickFormat(d => d.toLocaleString())).style("color", "#7A7A7A");
          chartGroup.append("g").attr("class", "x-axis-line").attr("transform", `translate(0, ${barHeight - margin.bottom})`).call(d3.axisBottom(xScale).tickSize(0).tickFormat(() => "")).style("color", "#7A7A7A");
          
          const labels = chartGroup.selectAll(".bar-label").data(dataCurrent).join("text").attr("class", "bar-label").attr("x", d => xScale(d.province) + xScale.bandwidth() / 2).attr("y", barHeight - margin.bottom + 15).attr("transform", d => `rotate(-45, ${xScale(d.province) + xScale.bandwidth() / 2}, ${barHeight - margin.bottom + 15})`).style("text-anchor", "end").style("font-size", "11px").style("fill", "#444").style("font-weight", "bold").style("pointer-events", "none").text(d => shortenProvName(d.province));
          
          barSvg.call(d3.zoom().scaleExtent([1, 4]).on("zoom", (event) => {
            const k = event.transform.k; barSvg.attr("width", Math.max(baseBarWidth, baseBarWidth * k));
            const xScaleZoomed = xScale.copy().range([margin.left, margin.left + (baseBarWidth - margin.left - margin.right) * k]);
            bars.attr("x", d => xScaleZoomed(d.province)).attr("width", xScale.bandwidth() * k);
            chartGroup.selectAll(".x-axis-line").remove(); chartGroup.append("g").attr("class", "x-axis-line").attr("transform", `translate(0, ${barHeight - margin.bottom})`).call(d3.axisBottom(xScaleZoomed).tickSize(0).tickFormat(() => "")).style("color", "#7A7A7A");
            labels.attr("x", d => xScaleZoomed(d.province) + (xScale.bandwidth() * k) / 2).attr("transform", d => `rotate(-45, ${xScaleZoomed(d.province) + (xScale.bandwidth() * k) / 2}, ${barHeight - margin.bottom + 15})`);
          }));
        }
      }

      function updateLineChart(provinceName) {
        currentProvince = provinceName;
        const lineSvg = d3.select("#line"); lineSvg.selectAll("*").remove();
        let lineData = allData.filter(d => d.province === provinceName).sort((a, b) => a.year - b.year); 
        if (lineData.length === 0) { const match = allData.find(d => d.province.includes(provinceName.replace(/市|省|自治区|壮族|回族|维吾尔/g, ''))); lineData = match ? allData.filter(d => d.province === match.province).sort((a, b) => a.year - b.year) : allData.filter(d => d.province === "北京市").sort((a, b) => a.year - b.year); provinceName = match ? match.province : "北京市"; }
        if (lineData.length === 0) return;
        
        if (isNarrowMode) {
          const rowHeight = 35; const margin = { top: 60, right: 40, bottom: 40, left: 70 }; const totalHeight = margin.top + (lineData.length * rowHeight) + margin.bottom;
          lineSvg.attr("width", baseLineWidth).attr("height", totalHeight).style("position", "relative");
          const chartGroup = lineSvg.append("g");
          lineSvg.append("text").attr("x", 20).attr("y", 30).style("font-size", "16px").style("font-weight", "bold").style("fill", "#555").text(`${provinceName} 历年人均消费支出（元）`);
          const yScale = d3.scalePoint().domain(lineData.map(d => d.year).reverse()).range([margin.top, totalHeight - margin.bottom]);
          const xScale = d3.scaleLinear().domain([0, d3.max(lineData, d => d.value) * 1.2]).range([margin.left, baseLineWidth - margin.right]);
          chartGroup.append("path").datum(lineData).attr("fill", "none").attr("stroke", morandiColors.line).attr("stroke-width", 3).attr("d", d3.line().x(d => xScale(d.value)).y(d => yScale(d.year)).curve(d3.curveMonotoneX));
          chartGroup.selectAll(".dot").data(lineData).join("circle").attr("cx", d => xScale(d.value)).attr("cy", d => yScale(d.year)).attr("r", 4).attr("fill", "#fff").attr("stroke", morandiColors.line).attr("stroke-width", 2);
          
          chartGroup.selectAll(".hit-circle").data(lineData).join("circle")
            .attr("class", "hit-circle").attr("cx", d => xScale(d.value)).attr("cy", d => yScale(d.year)).attr("r", 15).attr("fill", "transparent").style("cursor", "pointer")
            .on("mouseover", function(event, d) {
              const hoverGroup = chartGroup.append("g").attr("class", "hover-dot");
              hoverGroup.append("text").attr("x", xScale(d.value)).attr("y", yScale(d.year) - 15)
                .attr("text-anchor", "middle").style("font-size", "14px").style("font-weight", "bold").style("fill", morandiColors.barHover)
                .style("paint-order", "stroke").style("stroke", "#fff").style("stroke-width", "3px").text(`${d.year}年: ${d.value.toLocaleString()}`);
              chartGroup.selectAll(".dot").filter(dotData => dotData.year === d.year).attr("fill", morandiColors.barHover).attr("stroke", morandiColors.barHover).attr("r", 6);
            })
            .on("mouseout", function(event, d) {
              chartGroup.selectAll(".hover-dot").remove();
              chartGroup.selectAll(".dot").filter(dotData => dotData.year === d.year).attr("fill", "#fff").attr("stroke", morandiColors.line).attr("r", 4);
            });
            
          chartGroup.append("g").attr("transform", `translate(${margin.left}, 0)`).call(d3.axisLeft(yScale).tickSize(0)).style("color", "#7A7A7A"); 
          chartGroup.append("g").attr("transform", `translate(0, ${totalHeight - margin.bottom})`).call(d3.axisBottom(xScale).ticks(4).tickFormat(d => d.toLocaleString())).style("color", "#7A7A7A");
        } else {
          const lineHeight = document.getElementById("line-scroll").clientHeight - 15; const margin = { top: 60, right: 30, bottom: 50, left: 70 }; 
          lineSvg.attr("width", baseLineWidth).attr("height", lineHeight).style("position", "absolute");
                    const chartGroup = lineSvg.append("g");
          lineSvg.append("text").attr("x", 20).attr("y", 30).style("font-size", "16px").style("font-weight", "bold").style("fill", "#555").text(`${provinceName} 历年人均消费支出（元）`);
          const xScale = d3.scalePoint().domain(lineData.map(d => d.year)).range([margin.left, baseLineWidth - margin.right]);
          const yScale = d3.scaleLinear().domain([0, d3.max(lineData, d => d.value)]).range([lineHeight - margin.bottom, margin.top]);
          chartGroup.append("path").datum(lineData).attr("fill", "none").attr("stroke", morandiColors.line).attr("stroke-width", 3).attr("d", d3.line().x(d => xScale(d.year)).y(d => yScale(d.value)).curve(d3.curveMonotoneX));
          chartGroup.selectAll(".dot").data(lineData).join("circle").attr("cx", d => xScale(d.year)).attr("cy", d => yScale(d.value)).attr("r", 4).attr("fill", "#fff").attr("stroke", morandiColors.line).attr("stroke-width", 2);
          
          chartGroup.selectAll(".hit-circle").data(lineData).join("circle")
            .attr("class", "hit-circle").attr("cx", d => xScale(d.year)).attr("cy", d => yScale(d.value)).attr("r", 15).attr("fill", "transparent").style("cursor", "pointer")
            .on("mouseover", function(event, d) {
              const hoverGroup = chartGroup.append("g").attr("class", "hover-dot");
              hoverGroup.append("text").attr("x", xScale(d.year)).attr("y", yScale(d.value) - 15)
                .attr("text-anchor", "middle").style("font-size", "14px").style("font-weight", "bold").style("fill", morandiColors.barHover)
                .style("paint-order", "stroke").style("stroke", "#fff").style("stroke-width", "3px").text(`${d.year}年: ${d.value.toLocaleString()}`);
              chartGroup.selectAll(".dot").filter(dotData => dotData.year === d.year).attr("fill", morandiColors.barHover).attr("stroke", morandiColors.barHover).attr("r", 6);
            })
            .on("mouseout", function(event, d) {
              chartGroup.selectAll(".hover-dot").remove();
              chartGroup.selectAll(".dot").filter(dotData => dotData.year === d.year).attr("fill", "#fff").attr("stroke", morandiColors.line).attr("r", 4);
            });
            
          chartGroup.append("g").attr("transform", `translate(0, ${lineHeight - margin.bottom})`).call(d3.axisBottom(xScale)).style("color", "#7A7A7A"); 
          chartGroup.append("g").attr("transform", `translate(${margin.left}, 0)`).call(d3.axisLeft(yScale).ticks(5).tickFormat(d => d.toLocaleString())).style("color", "#7A7A7A");
        }
      }
      
      // 初始化渲染
      window.addEventListener('resize', () => { 
        updateDimensions(); 
        drawMap(); 
        renderTimeline(); 
        updateBarChart(); 
        updateLineChart(currentProvince); 
      });
      
      drawMap(); 
      renderTimeline(); 
      updateBarChart(); 
      updateLineChart(currentProvince);
    });
  </script>
</body>
</html>
