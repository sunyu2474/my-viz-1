<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Consumption Chart</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <svg width="800" height="500"></svg>

  <script>
    fetch("data.json")
      .then(res => res.json())
      .then(data => {
        const data2025 = data.filter(d => d.year === "2025");
        console.log(data2025);

        // 👇 画图代码全部写在这里面，console.log 下面
        const width = 800;
        const height = 500;
        const margin = { top: 40, right: 40, bottom: 100, left: 60 };

        data2025.sort((a, b) => b.value - a.value);

        const xScale = d3.scaleBand()
          .domain(data2025.map(d => d.province))
          .range([margin.left, width - margin.right])
          .padding(0.2);

        const yScale = d3.scaleLinear()
          .domain([0, d3.max(data2025, d => d.value)])
          .range([height - margin.bottom, margin.top]);

        const svg = d3.select("svg");
        const chartGroup = svg.append("g");
        
        chartGroup.selectAll("rect")
          .data(data2025)
          .join("rect")
          .attr("x", d => xScale(d.province))
          .attr("y", d => yScale(d.value))
          .attr("width", xScale.bandwidth())
          .attr("height", d => height - margin.bottom - yScale(d.value))
          .attr("fill", "steelblue");



        chartGroup.append("g")
          .attr("transform", `translate(${margin.left}, 0)`)
          .call(d3.axisLeft(yScale));
        chartGroup.append("g")
          .attr("class", "x-axis")
          .attr("transform", `translate(0, ${height - margin.bottom})`)
          .call(d3.axisBottom(xScale))
          .selectAll("text")
          .attr("transform", "rotate(-45)")
          .style("text-anchor", "end");
          const zoom = d3.zoom()
          .scaleExtent([1, 5])
          .on("zoom", (event) => {
            const k = event.transform.k;

            chartGroup.selectAll("rect")
              .attr("x", d => xScale(d.province) * k)
              .attr("width", xScale.bandwidth());

            chartGroup.selectAll(".x-axis").remove();
            chartGroup.append("g")
              .attr("class", "x-axis")
              .attr("transform", `translate(0, ${height - margin.bottom})`)
              .call(d3.axisBottom(xScale.copy().range(xScale.range().map(r => r * k))))
              .selectAll("text")
              .attr("transform", "rotate(-45)")
              .style("text-anchor", "end");
          });
        svg.call(zoom);
      });
  </script>
</body>
</html>
